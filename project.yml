name: TokenWatchMac

configs:
  Debug: debug
  Release: release

configFiles:
  Debug: Configs/Production.xcconfig
  Release: Configs/Production.xcconfig

options:
  developmentLanguage: zh-Hans
  deploymentTarget:
    macOS: "14.0"
  xcodeVersion: "26.0"

packages:
  TokenWatchCore:
    path: .
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    exactVersion: 2.9.6

targets:
  MacHub:
    type: application
    platform: macOS
    sources:
      - Apps/MacHub
      - Apps/Shared
    dependencies:
      - package: TokenWatchCore
        product: Domain
      - package: TokenWatchCore
        product: MacProviderAdapters
      - package: TokenWatchCore
        product: SyncProtocol
      - package: TokenWatchCore
        product: SyncSecurity
      - package: TokenWatchCore
        product: RemoteSync
      - package: TokenWatchCore
        product: LocalTransport
      - package: Sparkle
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nathanwu.TokenWatch.MacHub
        PRODUCT_NAME: TokenWatch Mac
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_HARDENED_RUNTIME: YES
    info:
      path: Apps/MacHub/Info.plist
      properties:
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleDisplayName: TokenWatch Mac
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHighResolutionCapable: true
        NSLocalNetworkUsageDescription: TokenWatch 使用本地网络与已配对的 iPhone 安全同步用量。
        NSBonjourServices:
          - _tokenwatch-p0._tcp
        SUFeedURL: https://github.com/NathanWu12/TokenWatch-Mac/releases/download/update-feed/appcast.xml
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 3600
        SUAllowsAutomaticUpdates: true
        SUAutomaticallyUpdate: false
        SUPublicEDKey: $(SPARKLE_PUBLIC_ED_KEY)
    entitlements:
      path: Apps/MacHub/MacHub.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.nathanwu.TokenWatch
        com.apple.developer.icloud-services:
          - CloudKit

schemes:
  MacHub:
    build:
      targets:
        MacHub: all
    run:
      config: Debug
    archive:
      config: Release
